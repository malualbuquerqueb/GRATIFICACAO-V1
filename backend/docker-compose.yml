services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sggd
      POSTGRES_USER: sggd
      POSTGRES_PASSWORD: ${SGGD_LOCAL_DB_PASSWORD:?Defina SGGD_LOCAL_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sggd -d sggd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      SGGD_PERFIL_SIMULADO: "0"

      POSTGRES_DB: sggd
      POSTGRES_USER: sggd
      POSTGRES_PASSWORD: ${SGGD_LOCAL_DB_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      OTEL_SERVICE_NAME: sggd-backend
      OTEL_TRACES_EXPORTER: console
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
