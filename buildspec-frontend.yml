version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd $CODEBUILD_SRC_DIR/frontend && npm ci
  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/frontend
      - echo "== FF6 Dependencias do front (npm audit)" && npm audit --omit=dev --audit-level=critical
      - npm run build
artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'